syntax = "proto2";
package hw.trezor.messages.mintlayer;

// Sugar for easier handling in Java
option java_package = "com.satoshilabs.trezor.lib.protobuf";
option java_outer_classname = "TrezorMessageMintlayer";

/**
* Chain Type used to determine the coin name and bech32 prefixes
*/
enum MintlayerChainType {
    Mainnet = 1;
    Testnet = 2;
    Regtest = 3;
    Signet = 4;
}

/**
 * Request: Ask the device for a Mintlayer address.
 * @start
 * @next MintlayerAddress
 * @next Failure
 */
message MintlayerGetAddress {
    repeated uint32 address_n = 1;               // BIP-32-style path to derive the key from master node
    required MintlayerChainType chain_type = 2;  // Chain type to use
    optional bool show_display = 3;              // optionally prompt for confirmation on trezor display
    optional bool chunkify = 4;                  // display the address in chunks of 4 characters
}

/**
 * Response: A Mintlayer address.
 * @end
 */
message MintlayerAddress {
    required string address = 1;    // prefixed bech32 Mintlayer address
}

/**
 * Request: Ask device for a public key corresponding to address_n path.
 * @start
 * @next MintlayerPublicKey
 */
message MintlayerGetPublicKey {
    repeated uint32 address_n = 1;               // BIP-32 path to derive the key from master node
    required MintlayerChainType chain_type = 2;  // Chain type to use
    optional bool show_display = 3;              // optionally prompt for confirmation on trezor display
}

/**
 * Response: A public key corresponding to address_n path.
 * @end
 */
message MintlayerPublicKey {
    required bytes public_key = 1;
    required bytes chain_code = 2;
}

/**
* Type of information required by transaction signing process
*/
enum MintlayerAddressType {
    PUBLIC_KEY = 1;
    PUBLIC_KEY_HASH = 2;
}

/**
 * Request: Ask device to sign a message
 * @start
 * @next Success
 * @next Failure
 */
message MintlayerSignMessage {
    repeated uint32 address_n = 1;                     // BIP-32 path to derive the key from master node
    required MintlayerChainType chain_type = 2;        // Chain type to use
    required MintlayerAddressType address_type = 3;    // Address type to use when signing the message Public key or Public key hash
    required bytes message = 4;                        // message to sign
}

/**
 * Request: Ask device to sign transaction
 * @start
 * @next MintlayerTxRequest
 * @next Failure
 */
message MintlayerSignTx {
    required uint32 outputs_count = 1;                         // number of transaction outputs
    required uint32 inputs_count = 2;                          // number of transaction inputs
    required MintlayerChainType chain_type = 3;                // Chain type to use
    optional uint32 version = 4 [default=1];                   // transaction version
    optional bool chunkify = 5;                                // display addresses in chunks of 4 characters
}

/**
 * Response: Device asks for information for signing transaction or returns the last result
 * If input_request or output_request is set, device awaits MintlayerTxAck matching the request type.
 * @end
 * @next MintlayerTxAck
 */
message MintlayerTxRequest {
    optional MintlayerTxInputRequest input_request = 1;                // request for additional data for an input
    optional MintlayerTxOutputRequest output_request = 2;              // request for additional data for an output
    optional MintlayerTxSigningResult signing_finished = 3;            // serialized data containing the signatures

    /**
    * Request for additional data for a tx input
    */
    message MintlayerTxInputRequest {
        required uint32 input_index = 1;                      // index for the requested input
    }

    /**
    * Request for additional data for a tx output
    */
    message MintlayerTxOutputRequest {
        required uint32 output_index = 1;                      // index for the requested output
        optional bytes tx_hash = 2;                           // transaction hash for the specified output or none for the current transaction that is being signed
    }
    /**
    * Structure representing a single signature
    */
    message MintlayerSignature {
        required bytes signature = 1;             // a single signature
        optional uint32 multisig_idx = 2;         // in case of multisig the index of the key
    }
    /**
    * Structure representing all of the signatures for a single input, can be multiple for a multisig address
    */
    message MintlayerSignaturesForInput {
        required uint32 input_index = 1;                      // 'signatures' field contains signed input of this index
        repeated MintlayerSignature signatures = 2;           // all signatures for an input
    }
    /**
    * Structure representing serialized data
    */
    message MintlayerTxSigningResult {
        repeated MintlayerSignaturesForInput signatures = 1;  // signatures for all signed inputs
        // TODO: add serialized transaction
    }
}


/**
* Enum for UTXO type used by MintlayerUtxoTxInput
*/
enum MintlayerUtxoType {
    TRANSACTION = 0;
    BLOCK = 1;
}

/** Data type for an address
 * @embed
 */
message MintlayerAddressPath {
    repeated uint32 address_n = 1;                                      // BIP-32 path to derive the key from master node
    optional uint32 multisig_idx = 2;                                   // in case of a multisig the key index
}

/** Data type for transaction UTXO input to be signed.
 *
 * @embed
 */
message MintlayerUtxoTxInput {
    repeated MintlayerAddressPath addresses = 1;                        // 0 or more addresses for which the corresponding private keys will be used to sign the transaction
    required bytes prev_hash = 2;                                       // hash of previous transaction output to spend by this input
    required uint32 prev_index = 3;                                     // index of previous output to spend
    required MintlayerUtxoType type = 4;                                // source type of the utxo (Transaction or BlockReward)
}

/** Data type for transaction Account input to be signed.
 *
 * @embed
 */
message MintlayerAccountTxInput {
    repeated MintlayerAddressPath addresses = 1;                                // 0 or more addresses for which the corresponding private keys will be used to sign the transaction
    required uint64 nonce = 2;                                                  // incremental account nonce
    optional MintlayerAccountSpendingDelegationBalance delegation_balance = 3;  // spend from a delegation balance
}

/** Data type for account spending from a Delegation Balance
 * @embed
 */
message MintlayerAccountSpendingDelegationBalance {
    required string delegation_id = 1;             // the delegation id of the account in bech32 encoding
    required bytes amount = 2;                     // amount of coins to spend
}

/** Data type for transaction Account Command input to be signed.
 *
 * @embed
 */
message MintlayerAccountCommandTxInput {
    repeated MintlayerAddressPath addresses = 1;                             // 0 or more addresses for which the corresponding private keys will be used to sign the transaction
    required uint64 nonce = 2;                                               // incremental account nonce
    optional MintlayerMintTokens mint = 3;                                   // mint tokens
    optional MintlayerUnmintTokens unmint = 4;                               // unmint tokens
    optional MintlayerLockTokenSupply lock_token_supply = 5;                 // lock token supply
    optional MintlayerFreezeToken freeze_token = 6;                          // freeze token
    optional MintlayerUnfreezeToken unfreeze_token = 7;                      // unfreeze token
    optional MintlayerChangeTokenAuthority change_token_authority = 8;       // change token authority
    optional MintlayerConcludeOrder conclude_order = 9;                      // conclude an order
    optional MintlayerFillOrder fill_order = 10;                             // fill an order
    optional MintlayerChangeTokenMetadataUri change_token_metadata_uri = 11; // change token metadata uri
}

/** Data type for transaction Order Command input to be signed.
 *
 * @embed
 */
message MintlayerOrderCommandTxInput {
    repeated MintlayerAddressPath addresses = 1;                             // 0 or more addresses for which the corresponding private keys will be used to sign the transaction
    optional MintlayerFillOrderV1 fill = 2;                                  // fill order
    optional MintlayerFreezeOrder freeze = 3;                                // freeze order
    optional MintlayerConcludeOrderV1 conclude = 4;                          // conclude order
}

/** Data type for order command Fill order
 * @embed
 */
message MintlayerFillOrderV1 {
    required string order_id = 1;                        // order id in bech32 encoding
    required bytes amount = 2;                           // amount in atoms corresponds to the order's ask currency
    required string destination = 3;                     // the destination in bech32 encoding
    required MintlayerOutputValue ask_balance = 4;       // the remaining ask balance of the order
    required MintlayerOutputValue give_balance = 5;      // the remaining give balance of the order
}

/** Data type for order command Freeze order
 * @embed
 */
message MintlayerFreezeOrder {
    required string order_id = 1;                        // order id in bech32 encoding
}

/** Data type for order command Conclude order
 * @embed
 */
message MintlayerConcludeOrderV1 {
    required string order_id = 1;                        // order id in bech32 encoding
    required MintlayerOutputValue filled_ask_amount = 2; // the already filled ask amount
    required MintlayerOutputValue give_balance = 3;      // the remaining give balance of the order
}

/** Data type for account command Mint tokens
 * @embed
 */
message MintlayerMintTokens {
    required string token_id = 1;                  // token id in bech32 encoding
    required bytes amount = 2;                     // amount of tokens to mint
}

/** Data type for account command Unmint tokens
 * @embed
 */
message MintlayerUnmintTokens {
    required string token_id = 1;                  // token id in bech32 encoding
}

/** Data type for account command Lock token supply
 * @embed
 */
message MintlayerLockTokenSupply {
    required string token_id = 1;                  // token id in bech32 encoding
}

/** Data type for account command Freeze token
 * @embed
 */
message MintlayerFreezeToken {
    required string token_id = 1;                  // token id in bech32 encoding
    required bool is_token_unfreezable = 2;        // is unfreezable after freezing it
}

/** Data type for account command Unfreeze token
 * @embed
 */
message MintlayerUnfreezeToken {
    required string token_id = 1;                  // token id in bech32 encoding
}

/** Data type for account command Change token authority
 * @embed
 */
message MintlayerChangeTokenAuthority {
    required string token_id = 1;                  // token id in bech32 encoding
    required string destination = 2;               // destination for the new authority in bech32 encoding
}

/** Data type for account command Conclude order
 * @embed
 */
message MintlayerConcludeOrder {
    required string order_id = 1;                        // order id in bech32 encoding
    required MintlayerOutputValue filled_ask_amount = 2; // the already filled ask amount
    required MintlayerOutputValue give_balance = 3;      // the remaining give balance of the order
}

/** Data type for account command Fill order
 * @embed
 */
message MintlayerFillOrder {
    required string order_id = 1;                        // order id in bech32 encoding
    required bytes amount = 2;                           // amount in atoms corresponds to the order's ask currency
    required string destination = 3;                     // the destination in bech32 encoding
    required MintlayerOutputValue ask_balance = 4;       // the remaining ask balance of the order
    required MintlayerOutputValue give_balance = 5;      // the remaining give balance of the order
}

/** Data type for account command Change token metadata uri
 * @embed
 */
message MintlayerChangeTokenMetadataUri {
    required string token_id = 1;                  // token id in bech32 encoding
    required bytes metadata_uri = 2;               // new metadata uri
}


/** Data type for output value information for the token
 * @embed
 */
message MintlayerTokenOutputValue {
    required string token_id = 1;                  // token id in bech32 encoding
    required bytes token_ticker = 2;               // the token ticker
    required uint32 number_of_decimals = 3;        // the number of decimals for the token
}

/** Data type for output value coins or token
 * @embed
 */
message MintlayerOutputValue {
    required bytes amount = 1;                     // lock until block height
    optional MintlayerTokenOutputValue token = 2;  // optional token info
}

/** Data type for transaction Transfer output to be signed.
 * @embed
 */
message MintlayerTransferTxOutput {
    required string address = 1;                    // destination address in bech32 encoding
    required MintlayerOutputValue value = 2;        // amount to spend in atoms for coin or token
}

/** Data type for time lock of an output
 * @embed
 */
message MintlayerOutputTimeLock {
    optional uint64 until_height = 1;                    // lock until block height
    optional uint64 until_time = 2;                      // lock until time
    optional uint64 for_block_count = 3;                 // lock for number of blocks
    optional uint64 for_seconds = 4;                     // lock for number of seconds
}

/** Data type for transaction Lock then transfer output to be signed.
 * @embed
 */
message MintlayerLockThenTransferTxOutput {
    required string address = 1;                    // destination address in bech32 encoding
    required MintlayerOutputValue value = 2;        // amount to spend in atoms for coin or token
    required MintlayerOutputTimeLock lock = 3;      // output lock
}

/** Data type for transaction Burn output to be signed.
 * @embed
 */
message MintlayerBurnTxOutput {
    required MintlayerOutputValue value = 1;        // amount to burn in atoms for coin or token
}

/** Data type for transaction Create stake pool output to be signed.
 * @embed
 */
message MintlayerCreateStakePoolTxOutput {
    required string pool_id = 1;                   // the pool id in bech32 encoding
    required bytes pledge = 2;                     // the pledge amount
    required string staker = 3;                    // the staker destination address in bech32 encoding
    required string vrf_public_key = 4;            // the VRF public key address in bech32 encoding
    required string decommission_key = 5;          // the decommission key in bech32 encoding
    required uint32 margin_ratio_per_thousand = 6; // the margin ratio per thousand
    required bytes cost_per_block = 7;             // the cost per block
}

/** Data type for transaction Produce block from stake output to be signed.
 * @embed
 */
message MintlayerProduceBlockFromStakeTxOutput {
    required string destination = 1;              // the staker destination address in bech32 encoding
    required string pool_id = 2;                  // the pool id in bech32 encoding
    required bytes staker_balance = 3;            // the current staker balance of the pool
}

/** Data type for transaction Create delegation id output to be signed.
 * @embed
 */
message MintlayerCreateDelegationIdTxOutput {
    required string destination = 1;              // the delegation owner destination address in bech32 encoding
    required string pool_id = 2;                  // the pool id in bech32 encoding
}

/** Data type for transaction Delegate staking output to be signed.
 * @embed
 */
message MintlayerDelegateStakingTxOutput {
    required bytes amount = 1;               // the amount to delegate
    required string delegation_id = 2;       // the delegation id in bech32 encoding
}

/**
* Enum for Token total supply used by MintlayerTokenTotalSupply
*/
enum MintlayerTokenTotalSupplyType {
    FIXED = 0;
    LOCKABLE = 1;
    UNLIMITED = 2;
}

/** Data type for Total token supply
 * @embed
 */
message MintlayerTokenTotalSupply {
    required MintlayerTokenTotalSupplyType type = 1;    // the type of total token supply
    optional bytes fixed_amount = 2;                    // optional amount in case of fixed total token supply
}

/** Data type for transaction Issue fungible token output to be signed.
 * @embed
 */
message MintlayerIssueFungibleTokenTxOutput {
    required bytes token_ticker = 1;                             // the token ticker
    required uint32 number_of_decimals = 2;                      // the number of decimals for the token
    required bytes metadata_uri = 3;                             // the metadata uri
    required MintlayerTokenTotalSupply total_supply = 4;         // the total supply limit
    required string authority = 5;                               // the token authority destination address in bech32 encoding
    required bool is_freezable = 6;                              // if the token freezable or not
}

/** Data type for transaction Issue NFT output to be signed.
 * @embed
 */
message MintlayerIssueNftTxOutput {
    required string token_id = 1;                                // the token id in bech32 encoding
    required string destination = 2;                             // the NFT authority destination address in bech32 encoding
    optional string creator = 3;                                 // the NFT creator destination address in bech32 encoding
    required bytes name = 4;                                     // the NFT name
    required bytes description = 5;                              // the NFT description
    required bytes ticker = 6;                                   // the NFT ticker
    optional bytes icon_uri = 7;                                 // the NFT icon uri
    optional bytes additional_metadata_uri = 8;                  // the NFT additional metadata uri
    optional bytes media_uri = 9;                                // the NFT media uri
    required bytes media_hash = 10;                              // the NFT media hash
}

/** Data type for transaction Data deposit output to be signed.
 * @embed
 */
message MintlayerDataDepositTxOutput {
    required bytes data = 1;    // the data to be deposited
}

/** Data type for transaction HTLC output to be signed.
 * @embed
 */
message MintlayerHtlcTxOutput {
    required MintlayerOutputValue value = 1;                   // amount to transfer for coin or token
    required bytes secret_hash = 2;                            // the hash of the exchanged secret
    required string spend_key = 3;                             // the key that can spend the HTLC given the secret in bech32 encoding
    required MintlayerOutputTimeLock refund_timelock = 4;      // time lock
    required string refund_key = 5;                            // the key for a refund after the time lock has expired in bech32 encoding
}

/** Data type for transaction output to be signed.
 * @embed
 */
message MintlayerCreateOrderTxOutput {
    required string conclude_key = 1;                          // The key that can authorize conclusion of the order in bech32 encoding
    required MintlayerOutputValue ask = 2;                     // ask value of the order for coin or token
    required MintlayerOutputValue give = 3;                    // give value of the order for coin or token
}

/**
 * Request: Data about input or output to be signed.
 *
 * @next MintlayerTxRequest
 */
message MintlayerTxAck {
    optional MintlayerTxInput input = 1;   // Ack response for an input
    optional MintlayerTxOutput output = 2; // Ack response for an output

    /**
     * Request: Data about input to be signed.
     *
     * @next MintlayerTxRequest
     */
    message MintlayerTxInput {
      optional MintlayerUtxoTxInput utxo = 1;                       // UTXO input
      optional MintlayerAccountTxInput account = 2;                 // account spending input
      optional MintlayerAccountCommandTxInput account_command = 3;  // account command input
      optional MintlayerOrderCommandTxInput order_command = 4;      // order command input
  }

    /**
     * Request: Data about output to be signed.
     *
     * @next MintlayerTxRequest
     */
    message MintlayerTxOutput {
      optional MintlayerTransferTxOutput transfer = 1;                                 // transfer output
      optional MintlayerLockThenTransferTxOutput lock_then_transfer = 2;               // lock then transfer output
      optional MintlayerBurnTxOutput burn = 3;                                         // burn output
      optional MintlayerCreateStakePoolTxOutput create_stake_pool = 4;                 // create stake pool output
      optional MintlayerProduceBlockFromStakeTxOutput produce_block_from_stake = 5;    // create block from stake output
      optional MintlayerCreateDelegationIdTxOutput create_delegation_id = 6;           // create delegation Id output
      optional MintlayerDelegateStakingTxOutput delegate_staking = 7;                  // delegate staking output
      optional MintlayerIssueFungibleTokenTxOutput issue_fungible_token = 8;           // issue fungible token output
      optional MintlayerIssueNftTxOutput issue_nft = 9;                                // issue NFT output
      optional MintlayerDataDepositTxOutput data_deposit = 10;                         // data deposit output
      optional MintlayerHtlcTxOutput htlc = 11;                                        // HTLC output
      optional MintlayerCreateOrderTxOutput create_order = 12;                         // Create order output
  }
}

